name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts and manifest
        run: |
          set -e
          for f in *.user.js mobile-mode/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('mobile-mode/manifest.json','utf8'))"
          grep -q '==UserScript==' *.user.js
